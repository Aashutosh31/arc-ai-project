name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      - name: Lint server
        working-directory: ./server
        run: npm run lint 2>/dev/null || echo "No lint script"

      - name: Lint client
        working-directory: ./client
        run: npm run lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      # Blocking gate: fail the build on any CRITICAL advisory.
      - name: Audit server dependencies (critical = fail)
        working-directory: ./server
        run: npm audit --audit-level=critical

      - name: Audit client dependencies (critical = fail)
        working-directory: ./client
        run: npm audit --audit-level=critical

      # Advisory visibility for HIGH advisories. The server tree carries
      # pre-existing high findings in the whatsapp-web.js/puppeteer
      # transitive chain (ws, tar-fs, extract-zip, …) whose only fixes are
      # breaking major upgrades — tracked as follow-up work. New highs show
      # here as warnings without permanently blocking merges.
      - name: Audit server dependencies (high = advisory)
        working-directory: ./server
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Audit client dependencies (high = advisory)
        working-directory: ./client
        run: npm audit --audit-level=high
        continue-on-error: true

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/arc-test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-do-not-use-in-production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      FRONTEND_URL: http://localhost:5173
      PUBLIC_BACKEND_URL: http://localhost:3000
      MCP_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      GOOGLE_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Run server tests with MongoDB
        working-directory: ./server
        run: npm run test:mongo

  test-client:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm test

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-audit, test-server, build-client]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          load: true
          tags: arc-ai/server:test

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --fail --only-verified