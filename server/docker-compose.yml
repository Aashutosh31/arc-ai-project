services:
  arc-ai:
    container_name: arc-ai
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    # Use bridge network instead of host for better portability
    ports:
      - "5000:5000"

    # Memory and CPU limits to prevent WhatsApp/Puppeteer resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

    # Health check for container orchestration
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./.whatsapp-sessions:/app/.whatsapp-sessions

    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /app/.whatsapp-sessions

